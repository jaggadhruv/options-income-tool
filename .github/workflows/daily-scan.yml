name: daily-options-scan
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scan.py
      - run: |
          git config user.name "scan-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A reports data index.html; git diff --cached --quiet || { git commit -m "Daily options scan"; git push; }
